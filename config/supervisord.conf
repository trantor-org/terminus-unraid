# ─────────────────────────────────────────────────────────────
# Supervisord config for Terminus All-in-One
# Manages: PostgreSQL 18, Valkey 9, Terminus web, Terminus worker
# ─────────────────────────────────────────────────────────────

[supervisord]
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
nodaemon=true

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

# ── PostgreSQL 18 (starts first) ──
[program:postgres]
command=/usr/lib/postgresql/18/bin/postgres -D /var/lib/postgresql/18/docker -c config_file=/var/lib/postgresql/18/docker/postgresql.conf
user=postgres
priority=10
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/postgres.log
stderr_logfile=/var/log/postgres.err.log

# ── Valkey 9 (starts second) ──
[program:valkey]
command=/usr/local/bin/valkey-server /etc/valkey/valkey.conf
user=valkey
priority=20
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/valkey.log
stderr_logfile=/var/log/valkey.err.log

# ── Database migration (one-shot, runs after Postgres but before the app) ──
# terminus-web/terminus-worker block on its outcome via wait-for-migration.sh
# so an image bump that adds a migration can never serve traffic against a
# stale schema, and a failing migration blocks startup instead of the app
# crash-looping against half-applied DDL.
[program:terminus-migrate]
command=bash -c 'set -a; source /etc/terminus-env; set +a; exec /usr/local/bin/migrate.sh /tmp'
user=app
priority=25
autostart=true
autorestart=false
startsecs=0
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/terminus-migrate.log
stderr_logfile=/var/log/terminus-migrate.err.log

# ── Terminus Web (Hanami/Puma, starts after DB+Valkey+migration) ──
[program:terminus-web]
command=bash -c "set -a; source /etc/terminus-env; set +a; cd /app; exec /usr/local/bin/wait-for-migration.sh /tmp bundle exec puma --config ./config/puma.rb"
user=app
priority=30
autostart=true
autorestart=true
startsecs=5
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/terminus-web.log
stderr_logfile=/var/log/terminus-web.err.log

# ── Terminus Worker (Sidekiq, starts after DB+Valkey+migration) ──
# Pre-start wait loop ensures Valkey is accepting connections before Sidekiq boots,
# preventing RedisClient::CannotConnectError cascades that crash the worker.
[program:terminus-worker]
command=bash -c 'set -a; source /etc/terminus-env; set +a; cd /app; VK_PASS=$(echo "$KEYVALUE_URL" | sed -n "s|.*://:\([^@]*\)@.*|\1|p"); for i in $(seq 1 30); do if valkey-cli -h 127.0.0.1 -p 6379 -a "$VK_PASS" ping 2>/dev/null | grep -q PONG; then break; fi; sleep 1; done; exec /usr/local/bin/wait-for-migration.sh /tmp bundle exec sidekiq -r ./config/sidekiq.rb'
user=app
priority=30
autostart=true
autorestart=true
startsecs=5
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/terminus-worker.log
stderr_logfile=/var/log/terminus-worker.err.log